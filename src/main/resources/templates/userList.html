<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>프레이밋 사용자 목록</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            margin: 20px 0;
        }

        thead {
            background-color: #f5f5f5;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }

        th {
            font-weight: bold;
        }
    </style>
</head>
<body>
<h1>사용자 목록</h1>
<table>
    <thead>
    <tr>
        <th>행 번호</th>
        <th>이름</th>
        <th>이메일</th>
        <th>닉네임</th>
        <th>유저 타입</th>
        <th>마케팅/홍보 동의</th>
        <th>진행 프로젝트 수</th>
        <th>완료 프로젝트 수</th>
        <th>포트폴리오 수</th>
        <th>간편 가입 타입</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="user, index : ${users}">
        <td th:text="${index.index + 1}">1</td>
        <td th:text="${user.name}"></td>
        <td th:text="${user.nickname}"></td>
        <td th:text="${user.email}"></td>
        <td th:text="${user.identity}"></td>
        <td th:text="${user.notificationsEnabled} == true ? 'O' : 'X'"></td>
        <td th:text="${user.inProgressProjectCount}"></td>
        <td th:text="${user.completedProjectCount}"></td>
        <td th:text="${user.portfolioCount}"></td>
        <td th:text="${user.oauthType} == 'NONE' ? 'X' : ${user.oauthType}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
