<!-- 프로젝트 목록 화면 (projects.html) -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>프로젝트 목록</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            margin: 20px 0;
        }

        thead {
            background-color: #f5f5f5;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }

        th {
            font-weight: bold;
        }
    </style>
</head>
<body>
<h1>프로젝트 목록</h1>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>프로젝트명</th>
        <th>진행 상태</th>
        <th>호스트 닉네임</th>
        <th>호스트 역할</th>
        <th>모집 역할</th>
        <th>삭제</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="project : ${projects}" th:id="|project-${project.id}|">
        <td th:text="${project.id}"></td>
        <td th:text="${project.name}"></td>
        <td th:text="${project.status}"></td>
        <td th:text="${project.host.nickname}"></td>
        <td th:text="${project.host.identity}"></td>
        <td th:text="${project.recruitmentRole}"></td>
        <td><button type="button" th:onclick="|deleteProject(${project.id})|">삭제</button></td>

    </tr>
    </tbody>
</table>

<script>
    function deleteProject(projectId) {
        if (!confirm('정말로 이 프로젝트를 삭제하시겠습니까?')) return;

        fetch(`/admin/projects/${projectId}`, {
            method: 'DELETE'
        })
            .then(response => {
                if (response.ok) {
                    alert('프로젝트가 삭제되었습니다.');
                    const row = document.getElementById(`project-${projectId}`);
                    if (row) row.remove();
                } else {
                    return response.text().then(msg => { throw new Error(msg); });
                }
            })
            .catch(error => {
                alert('삭제 실패: ' + error.message);
            });
    }
</script>
</body>
</html>
